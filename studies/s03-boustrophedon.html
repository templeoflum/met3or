<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>S-03</title>
<style>
  :root{--bg:#05080c;--ink:#e6edf3;--mu:#66707f;--bd:#222b38;
        --am:#f0a94a;--bl:#5aa7e8;--gr:#4ade80;
        --f:"SF Mono",ui-monospace,Menlo,Consolas,monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--f);
       display:flex;flex-direction:column;align-items:center;justify-content:center;
       padding:6vw;overflow:hidden}
  #plough{width:min(760px,100%);font-size:clamp(13px,2.3vw,19px);line-height:2.9}
  .row{display:flex;gap:.62em;align-items:baseline}
  .row .dir{flex:none;width:1.1em;color:var(--bd);font-size:.62em;opacity:.55}
  .row.rev{flex-direction:row-reverse}
  .row.rev .dir{order:2}
  .w{color:var(--mu);transition:color .16s ease,text-shadow .3s ease}
  .w.on{color:var(--ink);text-shadow:0 0 14px rgba(74,222,128,.55)}
  nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:2px;justify-content:center;
      padding:14px;font-size:10px;letter-spacing:.2em;color:var(--bd);z-index:9}
  nav a{color:var(--bd);text-decoration:none;padding:5px 9px;transition:color .15s}
  nav a:hover{color:var(--ink)}
  nav .n{color:var(--mu)}
</style>
</head>
<body>
  <div id="plough"></div>

<nav><a href="./">◫</a><a href="s02-carriage.html">‹</a><span class="n">03</span><a href="s04-phosphor.html">›</a></nav>

<script>
(function(){
  "use strict";
  // ── the furrow ───────────────────────────────────────────────────────
  // Boustrophedon: as the ox ploughs. The line does not lift at the margin
  // and carry back — it turns and comes home the other way. So every second
  // row is laid in the return direction, and the sentence is only continuous
  // if you read it serpentine: left to right, then right to left.
  //
  //   row 1   hey my name
  //   row 2   bob is            ← read right-to-left
  //   reads   hey my name is bob
  //
  // Glyphs are NOT mirrored. The order turns; the letterforms stay upright.
  const TEXT="held for collection the carrier did not come written "+
             "confirmation to follow it did not the bay was swept twice "+
             "and nothing was found to sweep two documents agree the item does not";
  const PER=6;                                  // words per furrow

  const root=document.getElementById("plough");
  const words=TEXT.split(" ");
  const order=[];                               // flat, in TRUE reading order

  for(let i=0;i<words.length;i+=PER){
    const chunk=words.slice(i,i+PER);
    const rev=(i/PER)%2===1;
    const row=document.createElement("div");
    row.className="row"+(rev?" rev":"");
    row.appendChild(Object.assign(document.createElement("span"),
      {className:"dir",textContent:rev?"‹":"›"}));
    // reversed rows are laid out right-to-left by flex, so the DOM keeps
    // true reading order — the turn is in the presentation, not the text
    for(const w of chunk){
      const el=document.createElement("span");
      el.className="w"; el.textContent=w;
      row.appendChild(el); order.push(el);
    }
    root.appendChild(row);
  }

  // The read-head walks the furrow in true order, so the serpentine reading
  // is shown rather than described. It is the only moving thing on the page.
  let i=0, t0=performance.now();
  const STEP=300;                               // ms per word
  (function tick(now){
    // rAF's timestamp is the frame start and can PRECEDE the performance.now()
    // captured a moment earlier, so the elapsed time goes briefly negative —
    // and JS's % keeps the sign, which indexes order[-1] and kills the loop.
    const n=order.length;
    const k=((Math.floor((now-t0)/STEP)%n)+n)%n;
    if(k!==i){
      order[i].classList.remove("on");
      i=k; order[i].classList.add("on");
    }
    requestAnimationFrame(tick);
  })(t0);
  order[0].classList.add("on");
})();
</script>
</body>
</html>
