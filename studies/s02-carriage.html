<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>S-02</title>
<style>
  :root{--bg:#05080c;--ink:#e6edf3;--mu:#66707f;--bd:#222b38;
        --am:#f0a94a;--bl:#5aa7e8;--gr:#4ade80;
        --f:"SF Mono",ui-monospace,Menlo,Consolas,monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--f);
       display:flex;flex-direction:column;align-items:center;justify-content:center;
       padding:6vw;overflow:hidden}
  #body{width:min(880px,100%)}
  .row{line-height:3.1;white-space:nowrap}
  /* The word is a fixed box sized by its ciphertext. The clear reading is
     laid over it, absolutely, so revealing never reflows the line. */
  .w{position:relative;display:inline-block;margin-right:1.5em;vertical-align:baseline}
  .enc{display:block;letter-spacing:.05em;transition:opacity .18s ease}
  .dec{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
       white-space:nowrap;letter-spacing:.22em;color:var(--ink);opacity:0;
       transition:opacity .18s ease;pointer-events:none}
  .p{color:var(--am)}.m{color:var(--bl)}.z{color:var(--gr)}
  nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:2px;justify-content:center;
      padding:14px;font-size:10px;letter-spacing:.2em;color:var(--bd);z-index:9}
  nav a{color:var(--bd);text-decoration:none;padding:5px 9px;transition:color .15s}
  nav a:hover{color:var(--ink)}
  nav .n{color:var(--mu)}
</style>
</head>
<body>
  <div id="body"></div>

<nav><a href="./">◫</a><a href="s01-dwell.html">‹</a><span class="n">02</span><a href="s03-boustrophedon.html">›</a></nav>

<script>
(function(){
  "use strict";
  // ── CIPHER.md ────────────────────────────────────────────────────────
  // A..M are +1..+13, N..Z are −1..−13, the space is 000. Negating every
  // trit gives the conjugate thirteen away — so the clear reading of a word
  // is that word read from the FAR world. Crossing the seam is ROT13.
  const val   = c => c===" " ? 0 : (c.charCodeAt(0)-65 < 13 ? c.charCodeAt(0)-64 : -(c.charCodeAt(0)-65-12));
  const trits = v => { const t=[]; for(let k=0;k<3;k++){const r=((v+1)%3+3)%3-1; t.push(r); v=(v-r)/3;} return t.reverse(); };
  const chr   = v => v===0 ? " " : (v>0 ? String.fromCharCode(64+v) : String.fromCharCode(77-v));
  const mirror= w => [...w].map(c=>chr(-val(c))).join("");   // negate every trit
  const SIGN={"1":"+","0":"0","-1":"−"}, CLS={"+":"p","0":"z","−":"m"};

  const LINES=[
    "THE ESCAPED ITEM IS NOT NAMED",
    "THAT IS HOW YOU WILL FIND IT",
    "UNREGISTERED ITEMS GET NOTHING",
  ];

  const root=document.getElementById("body"), words=[];
  for(const line of LINES){
    const row=document.createElement("div"); row.className="row";
    for(const word of line.split(" ")){
      const box=document.createElement("span"); box.className="w";
      const enc=document.createElement("span"); enc.className="enc";
      for(const ch of word){
        for(const t of trits(val(ch))){
          const s=document.createElement("span");
          s.textContent=SIGN[String(t)]; s.className=CLS[SIGN[String(t)]];
          enc.appendChild(s);
        }
        enc.appendChild(Object.assign(document.createElement("span"),{textContent:" "}));
      }
      const dec=document.createElement("span"); dec.className="dec";
      dec.textContent=mirror(word);            // the far-world reading
      box.append(enc,dec); row.appendChild(box);
      words.push({box,enc,dec});
    }
    root.appendChild(row);
  }

  // ── proximity opens one word at a time ───────────────────────────────
  // Hysteresis: a word opens at 0.55 and only closes below 0.40, so a word
  // sitting on the threshold cannot flicker between the two readings.
  const REACH=130;
  let mx=-9999,my=-9999,raf=0;
  addEventListener("pointermove",e=>{mx=e.clientX;my=e.clientY;if(!raf)raf=requestAnimationFrame(tick);},{passive:true});
  addEventListener("pointerleave",()=>{mx=my=-9999;if(!raf)raf=requestAnimationFrame(tick);},{passive:true});

  function tick(){
    raf=0;
    for(const o of words){
      const r=o.box.getBoundingClientRect();
      const near=Math.max(0,1-Math.hypot(mx-(r.left+r.width/2),my-(r.top+r.height/2))/REACH);
      const open=o.open ? near>0.40 : near>0.55;
      if(open!==o.open){
        o.open=open;
        o.dec.style.opacity=open?"1":"0";
        o.enc.style.opacity=open?"0.10":"";
      }
      if(!open) o.box.style.opacity=(0.66+0.34*near).toFixed(3);
      else o.box.style.opacity="1";
    }
  }
  tick();
})();
</script>
</body>
</html>
