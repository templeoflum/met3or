<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>S-01</title>
<style>
  :root{--bg:#05080c;--ink:#e6edf3;--mu:#66707f;--bd:#222b38;
        --am:#f0a94a;--bl:#5aa7e8;--gr:#4ade80;
        --f:"SF Mono",ui-monospace,Menlo,Consolas,monospace}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--f);
       display:flex;flex-direction:column;align-items:center;justify-content:center;
       gap:40px;cursor:crosshair;overflow:hidden}
  #word{font-size:clamp(40px,12vw,104px);letter-spacing:.16em;display:flex}
  #word span{display:inline-block;will-change:transform,opacity,filter}
  .p{color:var(--am)}.m{color:var(--bl)}.z{color:var(--gr)}
  #line{font-size:12.5px;color:var(--mu);letter-spacing:.08em;display:flex}
  #line span{display:inline-block;white-space:pre}
  #meter{width:min(420px,62vw);height:1px;background:var(--bd);position:relative}
  #meter i{position:absolute;inset:0 auto 0 0;background:var(--gr);width:0%}

  /* nav — the only chrome. index · prev · next, no words. */
  nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:2px;justify-content:center;
      padding:14px;font-size:10px;letter-spacing:.2em;color:var(--bd);z-index:9}
  nav a{color:var(--bd);text-decoration:none;padding:5px 9px;transition:color .15s}
  nav a:hover{color:var(--ink)}
  nav .n{color:var(--mu)}
</style>
</head>
<body>
  <div id="word"></div>
  <div id="line"></div>
  <div id="meter"><i id="fill"></i></div>

<nav><a href="./">◫</a><a href="s05-sweep.html">‹</a><span class="n">01</span><a href="s02-carriage.html">›</a></nav>

<script>
(function(){
  "use strict";
  const WORD=[["M","p"],["E","m"],["T","z"],["∃","z"],["O","m"],["R","p"]];
  const LINE="ser. 0006 · whereabouts unknown";
  const w=document.getElementById("word"), l=document.getElementById("line"), fill=document.getElementById("fill");

  const letters=WORD.map(([c,k])=>{const s=document.createElement("span");s.textContent=c;s.className=k;w.appendChild(s);return s;});
  const chars=[...LINE].map(c=>{const s=document.createElement("span");s.textContent=c;l.appendChild(s);return s;});

  let still=0, vel=0, px=null, py=null, last=performance.now();
  const DWELL=2.5;
  addEventListener("pointermove",e=>{ if(px!==null) vel+=Math.hypot(e.clientX-px,e.clientY-py); px=e.clientX; py=e.clientY; },{passive:true});
  addEventListener("pointerdown",()=>vel+=140,{passive:true});
  const seed=i=>{const x=Math.sin(i*127.1)*43758.5453;return x-Math.floor(x);};

  function frame(now){
    const dt=Math.min(0.05,(now-last)/1000); last=now;
    const moving=Math.min(1,vel/26); vel*=Math.pow(0.0016,dt);
    still += moving>0.06 ? -still*6*dt : dt/DWELL;
    still=Math.max(0,Math.min(1,still));

    const d=1-still;
    // The bloom is a glow, not a brightness multiply — the old version drove
    // filter:brightness and blew the letters out to white at full dwell.
    const bloom=Math.max(0,(still-0.9)/0.1);
    const breath=Math.sin(now/1000*Math.PI*2*1.2);

    letters.forEach((el,i)=>{
      const r1=seed(i)-0.5, r2=seed(i+9)-0.5;
      el.style.transform=`translate(${r1*80*d*d}px,${r2*42*d*d}px) rotate(${r1*22*d}deg)`;
      el.style.opacity=(0.12+0.88*still).toFixed(3);
      el.style.filter=`blur(${(d*d*6).toFixed(2)}px)`;
      el.style.textShadow=bloom>0
        ? `0 0 ${(10+16*bloom+breath*3).toFixed(1)}px currentColor`
        : "none";
    });
    chars.forEach((el,i)=>{
      const r=seed(i+31)-0.5;
      el.style.transform=`translate(${r*26*d*d}px,${(seed(i+77)-0.5)*14*d*d}px)`;
      el.style.opacity=(Math.max(0,still-0.4)/0.6*0.85).toFixed(3);
      el.style.filter=`blur(${(d*3).toFixed(2)}px)`;
    });
    fill.style.width=(still*100).toFixed(1)+"%";
    fill.style.background=bloom>0?"var(--am)":"var(--gr)";
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
