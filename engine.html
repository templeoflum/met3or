</head>

var soft=4*mm*(1-mm),sharp=soft*soft;

var hueG=Math.exp(-Math.pow((mm-.5)/CFG.gate,2));

var lumF=1.2*Math.pow(2,Math.min(Math.max(n,0),1)),strobe=.5+.5*Math.sin(2*Math.PI*lumF*T);

 p.globalAlpha=depA;p.lineWidth=2*(2.7+1.2*sharp)*CFG.beam*S;
 p.beginPath();p.moveTo(RUN[0][0],RUN[0][1]);for(var i=1;i<RUN.length;i++)p.lineTo(RUN[i][0],RUN[i][1]);p.stroke();
 p.globalAlpha=1;var tail=RUN[RUN.length-1];RUN.length=0;RUN.push(tail);}
for(var st=0;st<steps;st++){idx=(idx+1)%NP;var q=PATH[idx],L=LET[q.li];var xy=xf(q,L);bx=xy[0];by=xy[1];
 if(!q.pen){flushRun();RUN.length=0;RUN.push([bx,by]);RUNL=q.li;pen=false;continue;}
 RUN.push([bx,by]);pen=true;}
flushRun();
// ink-only interlace (uniform 50/50 lattice)
var SG=CFG.mode==='wipe'?1.5:0.0;
// the world = the trace + its projection into the return seat: five letters
// reflect about the datum; the R's band is carried whole (C₁), un-mirrored
wptx.clearRect(0,0,CW,CH);wptx.drawImage(pc,0,0,CW,CH);
var RA=CFG.refl+.2*soft*Aeff,RBX=(291+CFG.wx)*S,DY2=(2*(SEAM/S)+CFG.rs)*S,DYR=(2*(SEAM/S-108)+CFG.rs)*S;
wptx.globalAlpha=RA;
wptx.save();wptx.beginPath();wptx.rect(0,0,RBX,CH);wptx.clip();wptx.translate(0,DY2);wptx.scale(1,-1);wptx.drawImage(pc,0,0,CW,CH);wptx.restore();
wptx.save();wptx.beginPath();wptx.rect(RBX,0,CW-RBX,CH);wptx.clip();wptx.translate(0,DYR);wptx.drawImage(pc,0,0,CW,CH);wptx.restore();
wptx.globalAlpha=1;
ictx.clearRect(0,0,CW,CH);ictx.drawImage(wpc,0,0,CW,CH);nctx.clearRect(0,0,CW,CH);nctx.drawImage(dc,0,0,CW,CH);
for(var i=0;i<19;i++){var xi=i*20+10,di=Math.abs(xi-166)/214,oi=ss(mm*(1+SG)-di*SG),tp=oi*20;
if(tp>.05){var x0=Math.round(i*20*S),x1=Math.round((i*20+tp)*S);if(x1>x0){
[[ictx,wpc],[nctx,dc]].forEach(function(pr){var g=pr[0],src=pr[1];g.clearRect(x0,0,x1-x0,CH);g.save();g.beginPath();g.rect(x0,0,x1-x0,CH);g.clip();g.translate(CW,0);g.scale(-1,1);g.drawImage(src,0,0,CW,CH);g.restore();});}}}
c.fillStyle='#0a0f16';c.fillRect(0,0,CW,CH);
var dA=Math.max(.3,1-sharp*.7*(1-strobe*Aeff));
c.save();c.globalAlpha=dA;c.drawImage(nc,0,0,CW,CH);c.restore();
c.drawImage(ic,0,0,CW,CH);
// datum line (drafted, hairline)
var yS=Math.round(SEAM),wS=Math.max(1,Math.round((.5+.35*sharp)*S));c.globalAlpha=.62+.28*soft*Aeff;c.strokeStyle=MUT;c.lineWidth=wS;
c.beginPath();c.moveTo(20*S,yS);c.lineTo(360*S,yS);c.stroke();c.globalAlpha=1;
// contact event(s): one per horizon crossing, weighted by ink share
if(T>nb&&blinkQ.length===0){blinkQ.push(T);if(Math.random()<.18)blinkQ.push(T+.34);nb=T+(2.2+Math.random()*3.8)/CFG.blink;}
var occl=false;for(var bi=blinkQ.length-1;bi>=0;bi--){var bt=T-blinkQ[bi];if(bt>.32){blinkQ.splice(bi,1);continue;}if(bt>=0&&bt<.2)occl=true;}
// the vesica is generated, never drawn: the O and its return in EXACT

// seat moved at all, the symmetry is broken and there is no eye.
var OCX=262+CFG.wx,OCY=124,RCY=2*(SEAM/S)+CFG.rs-124,RR=24,DTM=SEAM/S;
if(Math.abs(DTM-OCY)<RR&&Math.abs(RCY+OCY-2*DTM)<.5){
[[OCX,1-mm],[380-OCX,mm]].forEach(function(pr){var exl=pr[0],share=pr[1],av=ss(Math.min(1,share*2));if(av<.02)return;

c.globalAlpha=av*.6;c.beginPath();c.arc(ex,RCY*S,RR*S,0,7);c.stroke();c.globalAlpha=av;

}

// analog scanlines
var sBase=.008+.045*soft+.06*sharp,sp=3.4;   // the raster is fixed structure — scanlines do not drift
for(var y=-sp+scan;y<CH/S;y+=sp){var li3=Math.floor(y/sp),a3=sBase*(.55+.75*nz(li3));if(nz(li3+999)<.05)continue;c.fillStyle='rgba(0,0,0,'+a3.toFixed(3)+')';c.fillRect(0,y*S,CW,1*S);}
var by2=(T*11.3*S)%(CH+90*S)-45*S;c.fillStyle='rgba(230,237,243,'+(.006+.012*soft+.014*sharp)+')';c.fillRect(0,by2,CW,22*S);
c.fillStyle='rgba(0,0,0,'+(.008+.016*soft+.016*sharp)+')';c.fillRect(0,by2+22*S,CW,10*S);
if(soft>.05){var fl=(Math.random()-.5)*.016*sharp;if(fl!==0){c.fillStyle=fl>0?'rgba(255,255,255,'+fl+')':'rgba(0,0,0,'+(-fl)+')';c.fillRect(0,0,CW,CH);}}
var deg=Math.round(mm*60-30),state=hueG>.35?'pure signal · full tilt':(mm<.3?'the grammar · the forward face':(mm>.7?'the grammar · the return face':'crossing'));
out.textContent='θ = '+(deg>0?'+':'')+deg+'° · '+state;
FI++;telPane(TELG,{m:mm,soft:soft,sharp:sharp,hueG:hueG,n:n,A:A,t:T,dwell:dwell,frun:frun,idx:idx,np:NP,li:PATH[idx].li,fi:FI});scopePane(SCOG,T,mm,col,ENVQ);
requestAnimationFrame(tf);}

// ---- layer capture: the figure as tiers with alpha (ink / datum / events) ----
(function(){
 var xs=[],ysv=[];
 LET.forEach(function(L){L.segs.forEach(function(sg){sg.forEach(function(pt){xs.push(pt[0]);ysv.push(pt[1]);});});});
 var gx0=Math.min.apply(0,xs),gx1=Math.max.apply(0,xs),gy0=Math.min.apply(0,ysv),gy1=Math.max.apply(0,ysv);
 var sd=SEAM/S,PADU=9;
 window.addEventListener('message',function(ev){
  var d=ev.data;if(!d)return;
  if(d.set===1){s.value=d.m;s.dispatchEvent(new Event('input'));return;}
  if(d.cfg){applyCfg(d.cfg);if(window.syncCfg)window.syncCfg();return;}
  if(d.cap!==1)return;
  var st=window.__WST||{mm:parseFloat(s.value),soft:0,sharp:0,Aeff:.6};
  var layers=d.layers||['ink','datum','events'];
  // the figure bounds follow the knobs — word position and the return seat
  var FX0=gx0+CFG.wx-12,FX1=gx1+CFG.wx+12,FY0=gy0-PADU;
  var FY1=Math.max(gy1,Math.max(2*sd-gy0,gy1+2*(sd-108))+CFG.rs)+PADU;
  var w=Math.round((FX1-FX0)*S*DP),h=Math.round((FY1-FY0)*S*DP);
  var k=document.createElement('canvas');k.width=w;k.height=h;
  var g=k.getContext('2d');g.scale(DP,DP);g.translate(-FX0*S,-FY0*S);
  if(layers.indexOf('ink')>=0)g.drawImage(ic,0,0,CW,CH);
  if(layers.indexOf('datum')>=0){
    var wS=Math.max(1,Math.round((.5+.35*st.sharp)*S));
    g.globalAlpha=.62+.28*st.soft*st.Aeff;g.strokeStyle=MUT;g.lineWidth=wS;
    g.beginPath();g.moveTo(20*S,SEAM);g.lineTo(360*S,SEAM);g.stroke();g.globalAlpha=1;
  }
  if(layers.indexOf('events')>=0){
    var OCX=262+CFG.wx,OCY=124,RCY=2*sd+CFG.rs-124,RR=24;
    if(Math.abs(sd-OCY)<RR&&Math.abs(RCY+OCY-2*sd)<.5){
    [[OCX,1-st.mm],[380-OCX,st.mm]].forEach(function(pr){
      var exl=pr[0],share=pr[1],av=ss(Math.min(1,share*2));if(av<.02)return;
      var ex=exl*S;g.globalAlpha=av;g.strokeStyle='rgba(90,167,232,'+(.42+.30*st.soft*st.Aeff)+')';g.lineWidth=2*S;
      g.beginPath();g.arc(ex,OCY*S,RR*S,0,7);g.stroke();
      g.globalAlpha=av*.6;g.beginPath();g.arc(ex,RCY*S,RR*S,0,7);g.stroke();g.globalAlpha=av;
      g.fillStyle=INK;g.beginPath();g.arc(ex,SEAM,5*S,0,7);g.fill();

    }
  }

   st:{m:st.mm,dwell:st.dwell||0,frun:st.frun||0,T:st.T||0,cfg:CFG}},'*');
 });
})();
// ---- the config board: name · scale · home. double-tap a knob to home it ----
(function(){
 var cfgEl=document.getElementById('cfg'),cfgb=document.getElementById('cfgb'),SY={};
 var ROWS=[['rs','RETURN SEAT',-40,40,1,'u'],['refl','REFLECT',.1,.9,.02,''],['wx','WORD X',-60,60,1,'u'],
  ['breath','BREATH',0,2,.05,'×'],['gate','HUE GATE',.02,.2,.005,''],['fvel','FREE-RUN VEL',0,8,.1,''],
  ['decay','DECAY',.03,.2,.005,''],['beam','BEAM',.5,1.6,.05,'×'],
  ['blink','BLINK',.25,3,.05,'×'],['mix','MIX',0,.12,.005,'']];
 function fmt(v,st){return (st<1? (Math.round(v*1000)/1000)+'' : v+'');}
 ROWS.forEach(function(r){
  var row=document.createElement('div');row.className='cfgrow';
  var lb=document.createElement('span');lb.className='cfglb';lb.textContent=r[1];
  var inp=document.createElement('input');inp.type='range';inp.min=r[2];inp.max=r[3];inp.step=r[4];inp.value=CFG[r[0]];
  var vl=document.createElement('span');vl.className='cfgv';
  function show(){var v=CFG[r[0]];vl.textContent=fmt(v,r[4])+(r[5]?' '+r[5]:'');vl.style.color=(v===HOME[r[0]])?'#66707f':'#e6edf3';}
  inp.addEventListener('input',function(){var o={};o[r[0]]=parseFloat(inp.value);applyCfg(o);show();});
  inp.addEventListener('dblclick',function(){var o={};o[r[0]]=HOME[r[0]];applyCfg(o);inp.value=CFG[r[0]];show();});
  row.appendChild(lb);row.appendChild(inp);row.appendChild(vl);cfgEl.appendChild(row);
  SY[r[0]]=function(){inp.value=CFG[r[0]];show();};show();
 });
 var trow=document.createElement('div');trow.className='cfgrow';
 var tlb=document.createElement('span');tlb.className='cfglb';tlb.textContent='TRANSITION';trow.appendChild(tlb);
 var bl=document.createElement('button');bl.textContent='lattice';
 var bw=document.createElement('button');bw.textContent='wipe';
 function tsync(){bl.className=CFG.mode==='lattice'?'on':'';bw.className=CFG.mode==='wipe'?'on':'';}
