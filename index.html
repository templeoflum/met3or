<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MET∃OR</title>

<meta property="og:title" content="MET∃OR">
<meta property="og:type" content="website">
<meta property="og:image" content="og.png">
<meta name="twitter:card" content="summary_large_image">

<style>
  :root{
    --bg:#05080c; --panel:#0a0f16; --ink:#e6edf3; --mu:#66707f; --bd:#222b38;
    --am:#f0a94a; --bl:#5aa7e8; --gr:#4ade80;
    --font:"SF Mono",ui-monospace,"DejaVu Sans Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--font);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:22px; padding:20px;
  }

  /* the mark */
  #engine{
    display:block; width:100%; max-width:820px; height:520px; border:0;
    opacity:0; transition:opacity .25s ease;
  }
  #engine.ready{opacity:1}

  /* links — icons only. render only when links.js has a url. */
  nav{
    display:flex; flex-wrap:wrap; justify-content:center; align-items:center;
    gap:clamp(14px,3.5vw,26px);
  }
  nav:empty{display:none}
  a{
    display:block; color:var(--mu); line-height:0;
    transition:color .15s ease, transform .15s ease;
  }
  a:hover,a:focus-visible{transform:translateY(-2px)}
  a:focus-visible{outline:none}
  a.p:hover,a.p:focus-visible{color:var(--am)}
  a.m:hover,a.m:focus-visible{color:var(--bl)}
  a.z:hover,a.z:focus-visible{color:var(--gr)}
  a svg{
    width:clamp(20px,4.6vw,25px); height:auto; display:block;
    fill:none; stroke:currentColor; stroke-width:1.7;
    stroke-linecap:round; stroke-linejoin:round;
  }
  a svg .solid{fill:currentColor; stroke:none}
</style>
</head>
<body>

  <iframe id="engine" src="engine.html?v=c537c607" title="MET∃OR" scrolling="no"></iframe>

  <nav id="links" aria-label="Listen"></nav>

<script src="links.js"></script>
<script>
(function(){
  "use strict";

  // ── the icon set ──────────────────────────────────────────────────────
  // Drawn as strokes on a 24×24 field to match the sheet's hairlines rather
  // than dropping in six different brands' filled logos. .solid switches a
  // shape to a fill (the play triangle, Instagram's lens dot).
  var ICONS = {
    youtube:
      '<rect x="1.6" y="5" width="20.8" height="14" rx="4.2"/>' +
      '<path class="solid" d="M10 9.3v5.4l4.8-2.7z"/>',
    instagram:
      '<rect x="3" y="3" width="18" height="18" rx="5.2"/>' +
      '<circle cx="12" cy="12" r="4.1"/>' +
      '<circle class="solid" cx="17.3" cy="6.7" r="1.15"/>',
    facebook:
      '<circle cx="12" cy="12" r="9.4"/>' +
      '<path d="M12.4 21.3V10.1c0-1.3.7-2 2-2h1.2"/>' +
      '<path d="M9.7 13.1h5.4"/>',
    x:
      '<path d="M4.4 4.4 19.6 19.6"/><path d="M19.6 4.4 4.4 19.6"/>',
    tiktok:
      '<path d="M14.2 4.2v10.6a3.6 3.6 0 1 1-3.6-3.6c.38 0 .75.06 1.1.18"/>' +
      '<path d="M14.2 4.2c.32 2.5 1.9 4.1 4.4 4.4"/>',
    soundcloud:
      '<path d="M2.6 14.4v3.2M5.6 12v5.6M8.6 9.9v7.7M11.6 12.9v4.7M14.6 8.4v9.2"/>' +
      '<path d="M17.2 17.6V9.1a4.1 4.1 0 0 1 4.7 4.1 2.7 2.7 0 0 1-.9 4.4z"/>',
    spotify:
      '<circle cx="12" cy="12" r="9.4"/>' +
      '<path d="M7.2 9.3c3.2-.9 6.6-.6 9.5.9"/>' +
      '<path d="M8 12.6c2.6-.7 5.3-.4 7.7.8"/>' +
      '<path d="M8.8 15.7c2-.5 4.1-.3 5.9.7"/>',
    apple:
      '<path d="M15.9 12.6c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.15-2.8.85-3.5.85s-1.8-.83-3-.81c-1.5.02-2.9.9-3.7 2.26-1.6 2.76-.4 6.85 1.1 9.1.75 1.1 1.64 2.33 2.8 2.29 1.13-.05 1.55-.73 2.91-.73s1.75.73 2.94.7c1.22-.02 1.99-1.11 2.73-2.22a9 9 0 0 0 1.23-2.5c-.03-.01-2.36-.9-2.38-3.6z"/>' +
      '<path d="M13.7 5.5a4 4 0 0 0 .93-2.87 4.07 4.07 0 0 0-2.65 1.37A3.8 3.8 0 0 0 11 6.76a3.36 3.36 0 0 0 2.7-1.26z"/>',
    bandcamp:
      '<circle cx="12" cy="12" r="9.4"/>' +
      '<path d="M14.9 8.6H9.6l-2.4 6.8h5.3z"/>',
  };

  // ── links ── nothing renders unless a url is filled in ────────────────
  var CLS = { "+":"p", "−":"m", "-":"m", "0":"z" };
  var nav = document.getElementById("links");
  (typeof LINKS !== "undefined" ? LINKS : [])
    .filter(function(l){ return l && typeof l.url === "string" && l.url.trim(); })
    .forEach(function(l){
      var glyph = ICONS[l.icon];
      if (!glyph) return;                       // unknown icon: draw nothing
      var a = document.createElement("a");
      a.href = l.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.className = CLS[l.sign] || "z";
      a.setAttribute("aria-label", l.label);    // the only name — no visible text
      a.title = l.label;
      a.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">' +
                    glyph + '</svg>';
      nav.appendChild(a);
    });

  // ── the frame ─────────────────────────────────────────────────────────
  // engine.html is a byte-identical copy of the workbench engine and is never
  // edited here. Everything but the mark and its sweep is hidden from the
  // outside, same-origin, so a resync can't undo it:
  //   #telC  telemetry pane      #scoC  oscilloscope pane
  //   .row   status line + config/drift/sound     #cfg  config board
  //   .foot  the render notes    .lbl  the ±30° captions
  var HIDE = "#telC,#scoC,.row,#cfg,.foot,.ctl .lbl{display:none!important}" +
             "html,body{min-height:0!important;background:transparent!important}" +
             "#wrap{min-height:0!important;padding:0!important;gap:14px!important}" +
             "canvas{width:100%!important;max-width:none!important}" +
             ".ctl{width:100%!important}";

  var frame = document.getElementById("engine");

  function fit(){
    try{
      var d = frame.contentDocument;
      if(!d || !d.documentElement) return;
      var h = d.documentElement.scrollHeight;
      if(h > 80) frame.style.height = h + "px";
    }catch(e){ /* file:// blocks this; the CSS height stands */ }
  }

  frame.addEventListener("load", function(){
    try{
      var d = frame.contentDocument;
      if(d){
        var st = d.createElement("style");
        st.textContent = HIDE;
        d.head.appendChild(st);
        if(typeof ResizeObserver === "function" && d.body){
          new ResizeObserver(fit).observe(d.body);
        }
      }
    }catch(e){}
    fit();
    frame.classList.add("ready");
  });

  window.addEventListener("resize", fit);
})();
</script>
</body>
</html>
