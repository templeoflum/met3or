<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MET∃OR</title>

<meta property="og:title" content="MET∃OR">
<meta property="og:type" content="website">
<meta property="og:image" content="og.png">
<meta name="twitter:card" content="summary_large_image">

<style>
  :root{
    --bg:#05080c; --panel:#0a0f16; --ink:#e6edf3; --mu:#66707f; --bd:#222b38;
    --am:#f0a94a; --bl:#5aa7e8; --gr:#4ade80;
    --font:"SF Mono",ui-monospace,"DejaVu Sans Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--font);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:22px; padding:20px;
  }

  /* the mark */
  #engine{
    display:block; width:100%; max-width:820px; height:520px; border:0;
    opacity:0; transition:opacity .25s ease;
  }
  #engine.ready{opacity:1}

  /* links — render only when links.js has a url. nothing otherwise. */
  nav{
    width:100%; max-width:820px;
    display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:8px;
  }
  nav:empty{display:none}
  a{
    display:flex; align-items:center; gap:10px; text-decoration:none;
    border:1px solid var(--bd); border-radius:9px; padding:11px 14px;
    background:var(--panel); color:var(--ink); font-size:13px;
    transition:border-color .15s, transform .15s;
  }
  a:hover{border-color:currentColor; transform:translateY(-1px)}
  a:focus-visible{outline:2px solid var(--gr); outline-offset:2px}
  .t{flex:none; width:14px; text-align:center}
  .p{color:var(--am)} .m{color:var(--bl)} .z{color:var(--gr)}
</style>
</head>
<body>

  <iframe id="engine" src="engine.html?v=c537c607" title="MET∃OR" scrolling="no"></iframe>

  <nav id="links" aria-label="Listen"></nav>

<script src="links.js"></script>
<script>
(function(){
  "use strict";

  // ── links ── nothing renders unless a url is filled in ────────────────
  var CLS = { "+":"p", "−":"m", "-":"m", "0":"z" };
  var nav = document.getElementById("links");
  (typeof LINKS !== "undefined" ? LINKS : [])
    .filter(function(l){ return l && typeof l.url === "string" && l.url.trim(); })
    .forEach(function(l){
      var a = document.createElement("a");
      a.href = l.url; a.target = "_blank"; a.rel = "noopener noreferrer";
      var t = document.createElement("span");
      t.className = "t " + (CLS[l.sign] || "z");
      t.textContent = l.sign || "0";
      t.setAttribute("aria-hidden","true");
      var s = document.createElement("span");
      s.textContent = l.label;
      a.appendChild(t); a.appendChild(s);
      nav.appendChild(a);
    });

  // ── the frame ─────────────────────────────────────────────────────────
  // engine.html is a byte-identical copy of the workbench engine and is never
  // edited here. Everything but the mark and its sweep is hidden from the
  // outside, same-origin, so a resync can't undo it:
  //   #telC  telemetry pane      #scoC  oscilloscope pane
  //   .row   status line + config/drift/sound     #cfg  config board
  //   .foot  the render notes    .lbl  the ±30° captions
  var HIDE = "#telC,#scoC,.row,#cfg,.foot,.ctl .lbl{display:none!important}" +
             "html,body{min-height:0!important;background:transparent!important}" +
             "#wrap{min-height:0!important;padding:0!important;gap:14px!important}" +
             "canvas{width:100%!important;max-width:none!important}" +
             ".ctl{width:100%!important}";

  var frame = document.getElementById("engine");

  function fit(){
    try{
      var d = frame.contentDocument;
      if(!d || !d.documentElement) return;
      var h = d.documentElement.scrollHeight;
      if(h > 80) frame.style.height = h + "px";
    }catch(e){ /* file:// blocks this; the CSS height stands */ }
  }

  frame.addEventListener("load", function(){
    try{
      var d = frame.contentDocument;
      if(d){
        var st = d.createElement("style");
        st.textContent = HIDE;
        d.head.appendChild(st);
        if(typeof ResizeObserver === "function" && d.body){
          new ResizeObserver(fit).observe(d.body);
        }
      }
    }catch(e){}
    fit();
    frame.classList.add("ready");
  });

  window.addEventListener("resize", fit);
})();
</script>
</body>
</html>
